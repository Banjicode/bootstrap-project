<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light text-white">

    <div class="container my-4">
        <!-- Header Row -->
        <div class="row mb-3">
            <div class="col-12">
                <!-- Header: Light Blue -->
                <div class="p-3 text-center fw-bold fs-5 text-white rounded" style="background-color: #4ad3f3;">
                    Header
                </div>
            </div>
        </div>

        <!-- Content Block: Left Side vs Right Side -->
        <!-- g-3 sets the gap between grid columns -->
        <div class="row mb-3 g-3">
            <!-- Left Column: Stacks on portrait phone, goes side-by-side (4 cols) on landscape/tablet (sm) -->
            <div class="col-sm-4 d-flex flex-column gap-3">
                <!-- Hero: Soft Purple -->
                <div class="p-5 text-center fw-bold fs-5 text-white rounded flex-grow-1 d-flex align-items-center justify-content-center"
                    style="background-color: #d4c5e9; min-height: 160px;">
                    Hero
                </div>
                <!-- Sidebar: Light Green -->
                <div class="p-5 text-center fw-bold fs-5 text-white rounded flex-grow-1 d-flex align-items-center justify-content-center"
                    style="background-color: #8cc34b; min-height: 200px;">
                    Sidebar
                </div>
            </div>

            <!-- Right Column: Stacks on portrait phone, goes side-by-side (8 cols) on landscape/tablet (sm) -->
            <div class="col-sm-8 d-flex flex-column gap-3">
                <!-- Main Content: Amber Gold -->
                <div class="p-5 text-center text-white rounded flex-grow-1 d-flex align-items-center justify-content-center"
                    style="background-color: #ffca28;">
                    <div>
                        <div class="fw-bold fs-5">Main Content</div>
                        <div class="small mt-1 text-white-50" style="font-size: 0.75rem;">
                            *If things do not look right, make sure your browser is in "Experimental Mode"*
                        </div>
                    </div>
                </div>
                <!-- Extra Content: Dark Gray -->
                <div class="p-4 text-center fw-bold fs-5 text-white rounded" style="background-color: #757575;">
                    Extra Content
                </div>
            </div>
        </div>

        <!-- Related Content Row -->
        <div class="row mb-3 g-3">
            <!-- Related Images (8 cols wide on landscape) -->
            <div class="col-sm-8">
                <div class="p-4 text-center fw-bold fs-5 text-white rounded" style="background-color: #1fa67a;">
                    Related Images
                </div>
            </div>
            <!-- Related Posts (4 cols wide on landscape) -->
            <div class="col-sm-4">
                <div class="p-4 text-center fw-bold fs-5 text-white rounded" style="background-color: #f8bbd0;">
                    Related Posts
                </div>
            </div>
        </div>

        <!-- Footer Row -->
        <div class="row">
            <div class="col-12">
                <!-- Footer: Deep Orange -->
                <div class="p-3 text-center fw-bold fs-5 text-white rounded" style="background-color: #ff9801;">
                    Footer
                </div>
            </div>
        </div>
    </div>
   
</body>
   
</html>
